[package]
name = "claudex-desktop"
version = "0.1.0"
edition = "2024"
description = "ClaudeX desktop shell built with Iced"

[dependencies]
directories = "6"
futures = "0.3"
iced = { version = "0.14", features = ["tokio"] }
iced_wry = "0.1"
portpicker = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
