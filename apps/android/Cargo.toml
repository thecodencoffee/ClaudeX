[package]
name = "claudex-android"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
slint-build = "1.19"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.19", features = ["backend-android-activity-06"] }
url = "2"

[package.metadata.android]
package = "com.claudex.android"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
strip = "strip"
manifest_override = "AndroidManifest.xml"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "ClaudeX"
debuggable = true
extract_native_libs = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
